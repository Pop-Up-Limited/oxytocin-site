<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Oxytocin</title>
<style>
:root {
  --paper: #efebe4; --sheet: #e7e2d9; --ink: #1f1c18; --mute: #6f685d;
  --line: rgba(31, 28, 24, .22); --pill: rgba(31, 28, 24, .07);
  --mono: "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
  --sans: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --serif: "New York", "Iowan Old Style", Georgia, "Songti SC", serif;
  --nav-h: clamp(72px, calc(3.125vw + 62px), 108px);
  --head-h: clamp(5.75rem, 7vw, 6.5rem);
  --pad: clamp(20px, calc(4.6875vw + 5px), 80px);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #16171c; --sheet: #1d1e24; --ink: #ebe7e0; --mute: #9a948a; --line: rgba(235, 231, 224, .2); --pill: rgba(235, 231, 224, .08); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }

/* ---------- top bar ---------- */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 26px 0; pointer-events: none; }
.bar > * { pointer-events: auto; }
/* past the hero the bar becomes paper, so text scrolling up never shows behind the wordmark */
.bar.solid { background: var(--paper); height: var(--nav-h); align-items: flex-start; pointer-events: auto; }
.mark { font: 24px/1 var(--serif); letter-spacing: -.01em; text-decoration: none; }
.nav { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--pill); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.nav a { font-size: 12px; padding: 6px 12px; border-radius: 999px; text-decoration: none; }
.nav a:hover { background: var(--pill); }
.spacer { width: 30px; }
@media (max-width: 640px) { .nav { display: none; } }

/* ---------- hero: the frosted intro stays pinned; the story rides up over it ---------- */
.hero { position: sticky; top: 0; height: 100vh; height: 100svh; z-index: 1; }
.hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

/* ---------- story: sticky title, stacking chapter headers, descriptions ---------- */
.story { position: relative; z-index: 2; background: var(--paper); padding: calc(var(--nav-h) + 20px) var(--pad) 0; border-top: 1px solid var(--line); scroll-margin-top: 0; }
.rail { max-width: 92rem; margin: 0 auto; }
.body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(16rem, 2fr); gap: 0 clamp(32px, calc(1.25vw + 28px), 48px); }
.sticky { position: sticky; top: var(--nav-h); grid-column: 2; grid-row: 1; align-self: start; }
.eyebrow { margin: 0 0 clamp(1.15rem, 2vw, 2rem); font: 430 clamp(.78rem, 1.2vw, .97rem)/1.35 var(--sans); letter-spacing: -.02em; text-transform: uppercase; color: var(--mute);
  opacity: 0; transform: translateY(14px); transition: opacity .7s cubic-bezier(.25,.46,.45,.94), transform .7s cubic-bezier(.25,.46,.45,.94); }
.title { display: flex; flex-wrap: wrap; gap: 0 .24em; max-width: 12ch; margin: 0; font: 400 clamp(24px, calc(1.875vw + 18px), 48px)/1 var(--serif); letter-spacing: -.035em; }
html[lang^="zh"] .title { gap: 0; max-width: 9em; line-height: 1.2; letter-spacing: 0; }
.mask { display: inline-block; overflow: hidden; padding-bottom: .06em; }
.word { display: block; transform: translateY(110%) rotate(6deg); transform-origin: 0 100%; transition: transform .8s cubic-bezier(.215,.61,.355,1); transition-delay: calc(var(--i) * 80ms); }
.sticky.in .eyebrow { opacity: 1; transform: none; }
.sticky.in .word { transform: none; }
.chapters { grid-column: 1; grid-row: 1; display: grid; align-content: start; }
.chapter { display: contents; }
.chapter header { position: sticky; top: calc(var(--nav-h) + var(--n) * var(--head-h)); z-index: calc(10 + var(--n)); min-height: var(--head-h);
  padding: .85rem 0 1rem; background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -2px 0 var(--paper); }
.meta { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 .65rem; font: 650 clamp(.72rem, .85vw, .82rem)/1.2 var(--sans); letter-spacing: .035em; text-transform: uppercase; color: var(--mute); }
.meta span:last-child { font: 400 11px var(--mono); letter-spacing: 0; text-transform: none; }
.chapter h3 { max-width: 24ch; margin: 0; font: 400 clamp(18px, calc(.7vw + 13.5px), 24px)/1.06 var(--serif); letter-spacing: -.025em; }
html[lang^="zh"] .chapter h3 { line-height: 1.3; letter-spacing: 0; }
.desc { min-height: clamp(28rem, 68svh, 46rem); max-width: 47ch; margin: 0; padding: clamp(2rem, 4vw, 4rem) 0 clamp(4rem, 8vw, 8rem);
  font-size: clamp(1.05rem, calc(.5vw + .9rem), 1.35rem); line-height: 1.45; color: var(--ink);
  opacity: 0; transform: translateY(28px); transition: opacity .7s cubic-bezier(.25,.46,.45,.94), transform .7s cubic-bezier(.25,.46,.45,.94); }
.desc.in { opacity: 1; transform: none; }
.closing { display: flex; align-items: center; justify-content: space-between; gap: 2rem; min-height: 64svh; padding: clamp(6rem, 10vw, 10rem) 0; }
.closing p { margin: 0; max-width: 10ch; font: 400 clamp(3.5rem, 7.5vw, 7rem)/.86 var(--serif); letter-spacing: -.05em; }
html[lang^="zh"] .closing p { max-width: 6em; line-height: 1.1; letter-spacing: 0; }
@media (max-width: 979px) {
  :root { --head-h: 4.6rem; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: relative; top: auto; grid-column: auto; grid-row: auto; padding-bottom: clamp(3rem, 8vw, 4rem); }
  .chapters { grid-column: auto; grid-row: 2; }
  .chapter h3 { font-size: 18px; }
  .desc { min-height: 56svh; }
  .closing { flex-direction: column; align-items: flex-start; justify-content: flex-end; min-height: 48svh; }
}

/* ---------- about + contact ---------- */
.about { position: relative; z-index: 2; background: var(--paper); padding: 0 var(--pad) 12vh; }
.about .grid { max-width: 92rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 3fr) minmax(16rem, 2fr); gap: 0 clamp(32px, calc(1.25vw + 28px), 48px); border-top: 1px solid var(--line); padding-top: 1.2rem; }
.about .eyebrow { opacity: 1; transform: none; }
.about p { margin: 0 0 16px; max-width: 40em; }
.facts { font: 12px/2 var(--mono); color: var(--mute); }
.contact { max-width: 92rem; margin: 10vh auto 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 30px 32px; border: 1px solid var(--line); border-radius: 18px; }
.contact p { margin: 0; font: 400 clamp(20px, 2.2vw, 28px)/1.2 var(--serif); }
.btn { flex: none; font-size: 14px; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; }
@media (max-width: 979px) { .about .grid { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .contact { flex-direction: column; align-items: flex-start; } }

/* ---------- footer: the frosted light again, under a curtain ---------- */
.curtain-end { position: relative; z-index: 2; height: 34px; background: var(--paper); border-radius: 0 0 34px 34px; box-shadow: 0 30px 60px rgba(0,0,0,.18); margin-bottom: 72vh; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; z-index: 0; overflow: hidden; color: var(--ink); visibility: hidden; }
.foot.on { visibility: visible; }
.foot iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.foot .inner { position: absolute; inset: auto 0 0 0; padding: 0 26px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.foot .big { font: clamp(64px, 13vw, 200px)/.9 var(--serif); letter-spacing: -.03em; }
.foot .links { text-align: right; font-size: 17px; line-height: 1.7; }
.foot .links a { display: block; text-decoration: none; }
.foot .links small { display: block; margin-top: 14px; font: 11px var(--mono); color: var(--mute); }
</style>
</head>
<body>
<header class="bar">
  <a class="mark" href="#top">oxytocin</a>
  <nav class="nav"><a href="#values" data-t="navValues"></a><a href="#about" data-t="navAbout"></a><a href="#contact" data-t="navContact"></a></nav>
  <span class="spacer"></span>
</header>

<div class="hero" id="top"><iframe src="intro.html?embed=1&sim=instant" title="Oxytocin"></iframe></div>

<section class="story" id="values">
  <div class="rail">
    <div class="body">
      <div class="sticky" id="sticky">
        <p class="eyebrow" data-t="eyebrow"></p>
        <h2 class="title" id="title"></h2>
      </div>
      <div class="chapters" id="chapters"></div>
    </div>
    <div class="closing"><p data-t="closing"></p></div>
  </div>
</section>

<section class="about" id="about">
  <div class="grid">
    <div>
      <p data-t="a1"></p>
      <p data-t="a2"></p>
    </div>
    <div>
      <p class="eyebrow" data-t="who"></p>
      <div class="facts" data-t="facts"></div>
    </div>
  </div>
  <div class="contact" id="contact"><p data-t="ask"></p><a class="btn" href="mailto:" data-t="cta"></a></div>
</section>
<div class="curtain-end"></div>

<footer class="foot" id="foot">
  <iframe src="intro.html?embed=1&nobox=1" title="" tabindex="-1" aria-hidden="true"></iframe>
  <div class="inner">
    <div class="big">oxytocin</div>
    <div class="links">
      <a href="#values" data-t="navValues"></a><a href="#about" data-t="navAbout"></a><a href="#contact" data-t="navContact"></a>
      <small>© 2026 Oxytocin LLC</small>
    </div>
  </div>
</footer>

<script>
const LANG = (new URLSearchParams(location.search).get('lang') || navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : 'en';

const COPY = {
  en: {
    navValues: 'Values', navAbout: 'About', navContact: 'Contact',
    eyebrow: 'What we make',
    title: ['Make', 'things', 'that', 'feel', 'like', 'a', 'held', 'hand.'],
    closing: 'That is the whole idea.',
    a1: 'Oxytocin is an independent studio. We design and build products for people who could use a warmer moment in their day.',
    a2: 'We care more about how something feels after you close it than how long it keeps you open.',
    who: 'Who we are', facts: 'Oxytocin LLC<br>Wyoming, United States<br>Since 2025',
    ask: 'Want to make something warm with us?', cta: 'Get in touch →',
  },
  zh: {
    navValues: '价值观', navAbout: '关于', navContact: '联系',
    eyebrow: '我们做什么',
    title: ['做', '让人', '觉得', '被', '牵着手', '的', '东西。'],
    closing: '就是这么简单。',
    a1: 'Oxytocin 是一家独立工作室，为那些需要一点温暖时刻的人，设计和制作产品。',
    a2: '比起让你停留多久，我们更在乎你关掉以后心里是什么感觉。',
    who: '我们是谁', facts: 'Oxytocin LLC<br>美国怀俄明州<br>始于 2025 年',
    ask: '想和我们一起做点温暖的东西吗？', cta: '联系我们 →',
  },
}[LANG];

// one chapter per value: label, the everyday thing it was first mistaken for, a headline and its description
const CHAPTERS = {
  en: [
    ['Warmth', 'warm_milk', 'Things should be warm to the touch.', 'Before anyone reads a word, they feel the temperature. We start every project there: the colour, the pace, the first sound, the way it says hello.'],
    ['Closeness', 'held_hand', 'Close enough to hear each other breathe.', 'We design for the moments people share, not the hours they spend alone with a screen. The best feature is often someone else.'],
    ['Gentleness', 'blanket', 'Nothing here is in a hurry.', 'No countdowns, no guilt, no red dots shouting for attention. If something matters, it can wait for you.'],
    ['Wonder', 'first_snow', 'Like seeing snow for the first time.', 'Somewhere in everything we make there is a small surprise, left on purpose for whoever looks closely enough.'],
    ['Safety', 'lamp_left_on', 'A light someone left on for you.', 'Your time and your attention are not ours to take. We ask for little, say plainly what we keep, and let you leave whenever you like.'],
    ['Aliveness', 'heartbeat', 'A heartbeat you can feel.', 'Things that breathe a little: light that drifts, words that change, a world that is slightly different every time you come back.'],
  ],
  zh: [
    ['温暖', '热牛奶', '东西摸上去应该是暖的。', '人还没读到一个字，就先感到了温度。我们每个项目都从这里开始：颜色、节奏、第一个声音、打招呼的方式。'],
    ['亲近', '牵着的手', '近到能听见彼此呼吸。', '我们为人与人一起的时刻设计，而不是一个人对着屏幕的那几个小时。最好的功能，常常是另一个人。'],
    ['温柔', '毯子', '这里没有什么是急的。', '没有倒计时，没有愧疚感，没有吵着要你看的小红点。真正重要的东西，可以等你。'],
    ['惊喜', '初雪', '像第一次看到雪。', '我们做的每样东西里，都故意藏着一个小惊喜，留给看得够仔细的人。'],
    ['安心', '留着的灯', '有人给你留了一盏灯。', '你的时间和注意力，都不是我们的。我们要得少，说清楚留下了什么，你想走随时可以走。'],
    ['生命感', '心跳', '能感觉到的心跳。', '会呼吸的东西：流动的光，会变的词，每次回来都有一点不一样的世界。'],
  ],
}[LANG];

document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = COPY[el.dataset.t]);
document.getElementById('title').innerHTML = COPY.title.map((w, i) => `<span class="mask"><span class="word" style="--i:${i}">${w}</span></span>`).join('');
document.getElementById('chapters').innerHTML = CHAPTERS.map(([label, guess, head, desc], n) => `
  <article class="chapter" style="--n:${n}">
    <header><p class="meta"><span>0${n + 1} ${label}</span><span>${guess} → ${label.toLowerCase()}</span></p><h3>${head}</h3></header>
    <p class="desc">${desc}</p>
  </article>`).join('');

// reveals, each plays once
const once = (els, threshold, rootMargin) => {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold, rootMargin });
  els.forEach(el => io.observe(el));
};
once([document.getElementById('sticky')], 0, '0px 0px -15% 0px');
once(document.querySelectorAll('.desc'), 0, '0px 0px -14% 0px');

const foot = document.getElementById('foot');
const bar = document.querySelector('.bar'), hero = document.querySelector('.hero');
const lip = document.querySelector('.curtain-end');
// paper bar from the end of the hero until the curtain's lifted edge passes under it
const syncBar = () => bar.classList.toggle('solid', scrollY > hero.offsetHeight - 2 && lip.getBoundingClientRect().top > bar.offsetHeight);
// the footer only shows once the curtain is near, so the hero never sees it
addEventListener('scroll', () => { foot.classList.toggle('on', scrollY + innerHeight > document.documentElement.scrollHeight - innerHeight * 1.2); syncBar(); }, { passive: true });

// smooth wheel scrolling (Lenis-style lerp into the native scroll position); touch stays native
(() => {
  let target = scrollY, current = scrollY, running = false;
  const max = () => document.documentElement.scrollHeight - innerHeight;
  addEventListener('wheel', e => {
    if (e.ctrlKey) return;
    e.preventDefault();
    if (!running) { target = current = scrollY; }
    target = Math.max(0, Math.min(max(), target + e.deltaY * (e.deltaMode === 1 ? 32 : 1)));
    if (!running) { running = true; requestAnimationFrame(step); }
  }, { passive: false });
  function step() {
    current += (target - current) * .1;
    if (Math.abs(target - current) < .5) { current = target; running = false; }
    scrollTo(0, current);
    if (running) requestAnimationFrame(step);
  }
  // anchor links: stop the glide so the jump lands
  document.addEventListener('click', e => { if (e.target.closest('a[href^="#"]')) { running = false; } });
})();
</script>
</body>
</html>
