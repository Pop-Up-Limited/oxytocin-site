<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Oxytocin</title>
<style>
:root {
  --paper: #efebe4; --sheet: #e7e2d9; --ink: #24211c; --mute: #6f685d; --line: rgba(36, 33, 28, .14);
  --pill: rgba(36, 33, 28, .07); --red: #ff2d2d; --green: #1dff5e;
  --mono: "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
  --sans: -apple-system, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
  --serif: "New York", "Iowan Old Style", Georgia, "Songti SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #16171c; --sheet: #1d1e24; --ink: #ebe7e0; --mute: #9a948a; --line: rgba(235, 231, 224, .12); --pill: rgba(235, 231, 224, .08); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }

/* ---------- top bar: wordmark, pill nav, motion toggle ---------- */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 26px 0; pointer-events: none; }
.bar > * { pointer-events: auto; }
.mark { font: 24px/1 var(--serif); letter-spacing: -.01em; text-decoration: none; }
.nav { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--pill); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.nav a { font-size: 12px; padding: 6px 12px; border-radius: 999px; text-decoration: none; }
.nav a:hover { background: var(--pill); }
.toggle { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--pill); color: var(--ink); font: 11px var(--mono); cursor: pointer; }
@media (max-width: 640px) { .nav { display: none; } }

/* ---------- hero: the live intro ---------- */
.hero { position: relative; height: 100vh; height: 100dvh; }
.hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

/* ---------- the curtain: everything above the footer, lifted with rounded bottom corners ---------- */
.curtain { position: relative; z-index: 2; background: var(--paper); border-radius: 0 0 34px 34px; margin-bottom: 72vh; box-shadow: 0 30px 60px rgba(0,0,0,.18); }

/* ---------- values world: sticky stage driven by scroll ---------- */
.world { position: relative; height: calc(var(--steps) * 100vh); }
.stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
.floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 62%; transform-origin: 50% 0;
  transform: perspective(520px) rotateX(62deg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%); mask-image: linear-gradient(to bottom, transparent, #000 35%); }
#swarm { position: absolute; inset: 0; width: 100%; height: 100%; }
.window { position: absolute; right: 5vw; top: 13vh; width: min(52vw, 720px); aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden;
  background: var(--sheet); box-shadow: 0 24px 70px rgba(0,0,0,.22), 0 0 0 1px var(--line); will-change: transform, opacity; }
.window .chrome { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font: 11px var(--mono); color: var(--mute); border-bottom: 1px solid var(--line); }
.window .chrome i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.window .chrome span { margin-left: 10px; }
.window .shot { position: absolute; inset: 30px 0 0; }
.window .glow { position: absolute; inset: 0; }
.window .det { position: absolute; left: 22%; top: 18%; width: 56%; height: 64%; border: 1.5px solid var(--c, var(--red)); }
.window .det .tag { position: absolute; left: -1.5px; bottom: 100%; background: var(--c, var(--red)); color: #fff; font: 11px/1.3 var(--mono); padding: 1px 5px; white-space: nowrap; }
.window .det.ok { --c: var(--green); }
.window .det.ok .tag { color: #03140a; }
.card { position: absolute; left: 4vw; bottom: 9vh; width: min(380px, 84vw); padding: 18px 20px 16px; border-radius: 14px;
  background: var(--sheet); box-shadow: 0 16px 40px rgba(0,0,0,.16), 0 0 0 1px var(--line); will-change: transform, opacity; }
.card .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.card h3 { margin: 0; font: 30px/1.1 var(--serif); letter-spacing: -.01em; }
.card .chip { font: 10px/1 var(--mono); padding: 4px 6px; background: var(--green); color: #03140a; }
.card p { margin: 0 0 10px; color: var(--mute); font-size: 15px; }
.card .from { font: 11px var(--mono); color: var(--mute); }
.overview { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; gap: 2.2vw; padding: 0 4vw; opacity: 0; pointer-events: none; }
.overview .mini { flex: 1 1 0; max-width: 190px; text-align: center; font: 12px var(--mono); }
.overview .mini div { aspect-ratio: 4 / 3; border-radius: 8px; margin-bottom: 10px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.overview .mini b { display: block; font: 18px var(--serif); margin-top: 2px; }
.count { position: absolute; left: 4vw; top: calc(env(safe-area-inset-top, 0px) + 80px); font: 11px var(--mono); letter-spacing: .12em; color: var(--mute); }
@media (max-width: 760px) {
  .window { left: 6vw; right: 6vw; width: auto; top: 46vh; }
  .card { bottom: 4vh; }
  .overview { flex-wrap: wrap; gap: 16px; }
  .overview .mini { flex-basis: 28%; }
}

/* ---------- manifesto + about ---------- */
.block { max-width: 1120px; margin: 0 auto; padding: 22vh 26px 10vh; }
.label { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0 0 22px; }
.manifesto h2 { font: 600 clamp(36px, 6.6vw, 92px)/1.04 var(--sans); letter-spacing: -.035em; margin: 0 0 30px; max-width: 13em; }
html[lang^="zh"] .manifesto h2 { letter-spacing: -.01em; line-height: 1.18; }
.manifesto .lede { font-size: clamp(18px, 2vw, 22px); color: var(--mute); max-width: 34em; margin: 0; }
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
.about { display: grid; grid-template-columns: 1fr 1.3fr; gap: 6vw; margin-top: 16vh; }
.about p { margin: 0 0 16px; }
.facts { font: 12px/2 var(--mono); color: var(--mute); border-top: 1px solid var(--line); padding-top: 16px; margin-top: 26px; }
@media (max-width: 760px) { .about { grid-template-columns: 1fr; } }

/* ---------- closer card ---------- */
.closer { max-width: 1120px; margin: 0 auto; padding: 6vh 26px 12vh; }
.closer .box { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 30px 32px; border-radius: 18px; background: var(--sheet); box-shadow: 0 0 0 1px var(--line); }
.closer .box p { margin: 0; font-size: clamp(18px, 2vw, 24px); line-height: 1.3; max-width: 22em; }
.btn { flex: none; font-size: 14px; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; }
@media (max-width: 640px) { .closer .box { flex-direction: column; align-items: flex-start; } }

/* ---------- footer: fixed under the curtain, revealed as it lifts ---------- */
.foot { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; z-index: 1; overflow: hidden; color: #fff; }
.foot iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.foot .inner { position: absolute; inset: auto 0 0 0; padding: 0 26px calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.foot .big { font: clamp(64px, 13vw, 200px)/.9 var(--serif); letter-spacing: -.03em; mix-blend-mode: difference; }
.foot .links { text-align: right; font-size: 17px; line-height: 1.7; mix-blend-mode: difference; }
.foot .links a { display: block; text-decoration: none; }
.foot .links small { display: block; margin-top: 14px; font: 11px var(--mono); }
</style>
</head>
<body>
<header class="bar">
  <a class="mark" href="#top">oxytocin</a>
  <nav class="nav"><a href="#values" data-t="navValues"></a><a href="#manifesto" data-t="navAbout"></a><a href="#contact" data-t="navContact"></a></nav>
  <button class="toggle" id="toggle" aria-label="pause">II</button>
</header>

<div class="curtain" id="top">
  <div class="hero"><iframe src="intro.html?embed=1&sim=instant" title="Oxytocin"></iframe></div>

  <section class="world" id="values" style="--steps: 8">
    <div class="stage">
      <div class="floor"></div>
      <canvas id="swarm"></canvas>
      <div class="count" id="count"></div>
      <div class="window" id="win">
        <div class="chrome"><i></i><i></i><i></i><span id="file"></span></div>
        <div class="shot"><div class="glow" id="winGlow"></div><div class="det" id="det"><span class="tag" id="tag"></span></div></div>
      </div>
      <div class="card" id="card">
        <div class="row"><h3 id="cardTitle"></h3><span class="chip">1.00</span></div>
        <p id="cardLine"></p>
        <div class="from" id="cardFrom"></div>
      </div>
      <div class="overview" id="overview"></div>
    </div>
  </section>

  <section class="block manifesto" id="manifesto">
    <p class="label reveal" data-t="l1"></p>
    <h2 class="reveal" data-t="h1"></h2>
    <p class="lede reveal" data-t="p1"></p>
    <div class="about">
      <div><p class="label reveal" data-t="l3"></p></div>
      <div class="reveal">
        <p data-t="a1"></p>
        <p data-t="a2"></p>
        <div class="facts" data-t="facts"></div>
      </div>
    </div>
  </section>

  <section class="closer" id="contact">
    <div class="box reveal"><p data-t="ask"></p><a class="btn" href="mailto:" data-t="cta"></a></div>
  </section>
</div>

<footer class="foot">
  <iframe src="intro.html?embed=1&sim=instant&nobox=1" title="" tabindex="-1" aria-hidden="true"></iframe>
  <div class="inner">
    <div class="big">oxytocin</div>
    <div class="links">
      <a href="#values" data-t="navValues"></a><a href="#manifesto" data-t="navAbout"></a><a href="#contact" data-t="navContact"></a>
      <small>© 2026 Oxytocin LLC</small>
    </div>
  </div>
</footer>

<script>
const LANG = (new URLSearchParams(location.search).get('lang') || navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : 'en';
const T = {
  en: {
    navValues: 'Values', navAbout: 'About', navContact: 'Contact',
    l1: 'Manifesto', h1: 'Oxytocin is what your body makes when someone holds your hand.',
    p1: 'We make things that try to do the same: software and experiences that leave people a little closer, a little safer, a little more alive.',
    l3: 'Who we are',
    a1: 'Oxytocin is an independent studio. We design and build products for people who could use a warmer moment in their day.',
    a2: 'We care more about how something feels after you close it than how long it keeps you open. Small team, slow decisions, careful details.',
    facts: 'Oxytocin LLC<br>Wyoming, United States<br>Since 2025',
    ask: 'Want to make something warm with us?', cta: 'Get in touch →',
    of: 'of', overview: 'All six',
  },
  zh: {
    navValues: '价值观', navAbout: '关于', navContact: '联系',
    l1: '宣言', h1: '有人牵起你的手时，身体会分泌一种叫催产素的东西。',
    p1: '我们想做的东西，也能做到这件事：让人用完以后，觉得离别人近了一点、安心了一点、活着的感觉多了一点。',
    l3: '我们是谁',
    a1: 'Oxytocin 是一家独立工作室，为那些需要一点温暖时刻的人，设计和制作产品。',
    a2: '比起让你停留多久，我们更在乎你关掉以后心里是什么感觉。团队小，决定慢，细节仔细。',
    facts: 'Oxytocin LLC<br>美国怀俄明州<br>始于 2025 年',
    ask: '想和我们一起做点温暖的东西吗？', cta: '联系我们 →',
    of: '/', overview: '六件事',
  },
}[LANG];
document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = T[el.dataset.t]);

// ---------- the six values: each first mistaken for an everyday thing ----------
const VALUES = [
  { hues: [18, 345], en: ['warmth', 'warm_milk', 'The feeling of a cup held in both hands.'], zh: ['温暖', '热牛奶', '双手捧着一杯热饮的那种感觉。'] },
  { hues: [330, 275], en: ['closeness', 'held_hand', 'Near enough to hear each other breathe.'], zh: ['亲近', '牵着的手', '近到能听见彼此呼吸。'] },
  { hues: [38, 8], en: ['gentleness', 'blanket', 'Nothing here is in a hurry.'], zh: ['温柔', '毯子', '这里没有什么是急的。'] },
  { hues: [205, 255], en: ['wonder', 'first_snow', 'Like seeing snow for the first time, every time.'], zh: ['惊喜', '初雪', '每一次都像第一次看到雪。'] },
  { hues: [34, 300], en: ['safety', 'lamp_left_on', 'A light someone left on for you.'], zh: ['安心', '留着的灯', '有人给你留了一盏灯。'] },
  { hues: [352, 22], en: ['aliveness', 'heartbeat', 'A heartbeat you can feel.'], zh: ['生命感', '心跳', '能感觉到自己的心跳。'] },
].map(v => ({ hues: v.hues, name: v[LANG][0], guess: v[LANG][1], line: v[LANG][2] }));
const N = VALUES.length;
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const glowCSS = h => `radial-gradient(42% 52% at 40% 48%, hsl(${h[0]} 92% 62% / .95), transparent 72%), radial-gradient(40% 50% at 62% 54%, hsl(${h[1]} 90% 64% / .9), transparent 72%)`;

const $ = id => document.getElementById(id);
const win = $('win'), card = $('card'), det = $('det'), tag = $('tag'), overview = $('overview');
overview.innerHTML = VALUES.map((v, i) => `<div class="mini"><div style="background:${glowCSS(v.hues)}"></div>0${i + 1}<b>${v.name}</b></div>`).join('');

// ---------- particle swarm: two glows made of dots that scatter and re-form between values ----------
const cv = $('swarm'), cx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1;
const P = Array.from({ length: 1500 }, (_, i) => {
  const g = i % 2, a = Math.random() * 6.283, r = Math.sqrt(-2 * Math.log(1 - Math.random() * .98)) * .5;
  return { g, hx: Math.cos(a) * r, hy: Math.sin(a) * r, sx: (Math.random() - .5) * 6, sy: (Math.random() - .5) * 3, s: .6 + Math.random() * 1.6, ph: Math.random() * 6.283 };
});
function sizeCanvas() { DPR = Math.min(devicePixelRatio || 1, 2); CW = cv.clientWidth; CH = cv.clientHeight; cv.width = CW * DPR; cv.height = CH * DPR; }
addEventListener('resize', sizeCanvas); sizeCanvas();

let paused = false, shown = 0, last = 0;
$('toggle').onclick = () => { paused = !paused; $('toggle').textContent = paused ? '▶' : 'II'; };

function stepState(p) {
  // steps: 0..N-1 values, N = overview; p in [0, N]
  const i = Math.min(N - 1, Math.floor(p)), f = p - Math.floor(p);
  return { i, f, over: Math.max(0, Math.min(1, (p - (N - .6)) / .6)) };
}

function drawSwarm(t, p) {
  const { i, f, over } = stepState(p);
  const nx = Math.min(N - 1, i + 1);
  // scatter peaks halfway between two values
  const k = p >= N - 1 ? 0 : Math.max(0, Math.min(1, (f - .55) / .45));
  const scat = Math.sin(Math.PI * k) * (1 - over);
  const mix = k > .5 ? 1 : 0;
  const v = VALUES[mix ? nx : i];
  const small = CW < 760;
  const ox = small ? CW * .5 : CW * .2, oy = small ? CH * .27 : CH * .5, R = Math.min(CW, CH) * (small ? .17 : .2);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.clearRect(0, 0, CW, CH);
  const alpha = 1 - over;
  if (alpha <= 0) return;
  cx.globalCompositeOperation = dark() ? 'lighter' : 'multiply';
  const orbit = t * .45;
  for (const q of P) {
    const cxg = Math.cos(orbit + q.g * Math.PI) * R * .34, cyg = Math.sin(orbit + q.g * Math.PI) * R * .26;
    const wob = paused ? 0 : Math.sin(t * 1.3 + q.ph) * 1.4;
    const x = ox + cxg + q.hx * R + q.sx * R * scat + wob;
    const y = oy + cyg + q.hy * R + q.sy * R * scat + Math.cos(t * 1.1 + q.ph) * 1.2;
    const d = Math.hypot(q.hx, q.hy);
    cx.globalAlpha = alpha * Math.max(.08, 1 - d * 1.1) * (1 - scat * .4);
    cx.fillStyle = `hsl(${v.hues[q.g]} 90% ${dark() ? 62 : 58}%)`;
    cx.fillRect(x, y, q.s * 2.2, q.s * 2.2);
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
}

// window + card slide in from the right / bottom, detection runs red → green as the step settles
let lastI = -1;
function layout(t, p) {
  const { i, f, over } = stepState(p);
  const v = VALUES[i];
  if (i !== lastI) {
    lastI = i;
    $('file').textContent = `det v1  sample_0${i + 1}.jpg`;
    $('winGlow').style.background = glowCSS(v.hues);
    $('cardTitle').textContent = v.name;
    $('cardLine').textContent = v.line;
    $('cardFrom').textContent = `${v.guess} → ${v.name}`;
    $('count').textContent = `0${i + 1} ${T.of} 0${N}`;
  }
  // in: f 0→.25, hold, out: f .7→1 (not after the last value)
  const inK = Math.min(1, f / .25), outK = i === N - 1 ? 0 : Math.max(0, (f - .7) / .3);
  const ease = x => 1 - Math.pow(1 - x, 3);
  const enter = i === 0 && p < .02 ? 1 : ease(inK);
  const leave = ease(outK) + over;
  win.style.transform = `translateX(${(1 - enter) * 40 - leave * 30}vw)`;
  win.style.opacity = Math.max(0, Math.min(enter, 1 - leave));
  card.style.transform = `translateY(${(1 - enter) * 30 + leave * 20}vh)`;
  card.style.opacity = Math.max(0, Math.min(enter, 1 - leave));
  overview.style.opacity = over;
  overview.style.pointerEvents = over > .5 ? 'auto' : 'none';
  $('count').style.opacity = 1 - over;
  // detection inside the window: red guess while settling, green value once held
  const lock = Math.max(0, Math.min(1, (f - .28) / .2));
  if (lock < 1) {
    const reds = ['#ff2d2d', '#ff1f4b', '#ff5a36', '#e8121f', '#ff3d6e'];
    if (!paused && Math.random() < .25) det.style.setProperty('--c', reds[Math.floor(Math.random() * reds.length)]);
    det.classList.remove('ok');
    const conf = .3 + .38 * lock + (paused ? 0 : (Math.random() - .5) * .04);
    tag.textContent = `${lock > .7 ? v.name : v.guess} ${conf.toFixed(2)}`;
    det.style.transform = paused ? '' : `translate(${(Math.random() - .5) * 3}px, ${(Math.random() - .5) * 3}px)`;
  } else if (!det.classList.contains('ok')) {
    det.style.removeProperty('--c'); det.style.transform = ''; det.classList.add('ok'); tag.textContent = `${v.name} 1.00`;
  }
}

// smooth scroll-linked progress (eased toward the scroll position)
const world = $('values');
function target() {
  const r = world.getBoundingClientRect(), span = world.offsetHeight - innerHeight;
  // the last screen of scrolling holds the overview
  return Math.max(0, Math.min(N, (-r.top / span) * (N + 1)));
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  shown += (target() - shown) * Math.min(1, dt * 9);
  const t = now / 1000;
  drawSwarm(t, shown);
  layout(t, shown);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// text reveals
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold: .2 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
